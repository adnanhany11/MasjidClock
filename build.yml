name: Build Simple APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install Cordova
      run: npm install -g cordova
    - name: Create Cordova Project
      run: cordova create app com.adnan.masjidclock MasjidClock
    - name: Copy Files
      # هنا نخبر الأداة بالبحث عن ملفك في المجلد الصحيح (src)
      run: |
        if [ -d "src" ]; then cp -r src/* app/www/; elif [ -d "dist" ]; then cp -r dist/* app/www/; else cp -r * app/www/; fi
    - name: Build APK
      run: cd app && cordova platform add android && cordova build android
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MasjidClock-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
