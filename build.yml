name: Build Simple APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install Cordova
      run: npm install -g cordova
    - name: Create Cordova Project
      run: cordova create app com.adnan.masjidclock MasjidClock
    - name: Copy Files (Smart Search)
      run: |
        echo "Searching for index.html..."
        if [ -f "index.html" ]; then cp index.html app/www/; 
        elif [ -f "src/index.html" ]; then cp src/index.html app/www/; 
        elif [ -f "dist/index.html" ]; then cp dist/index.html app/www/; 
        else 
          echo "index.html not found locally, downloading from live site..."
          curl -L -o app/www/index.html "https://clockislam.42web.io/index.php"
        fi
        
        # نسخ مجلد الصوت إن وجد
        if [ -d "sounds" ]; then cp -r sounds app/www/; fi
        if [ -d "src/sounds" ]; then cp -r src/sounds app/www/; fi
    - name: Build APK
      run: cd app && cordova platform add android && cordova build android
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MasjidClock-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
